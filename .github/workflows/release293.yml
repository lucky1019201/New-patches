name: Publish verified clown 293 assets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release293.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Upload verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,hashlib,urllib.request,urllib.error
          repo='lucky1019201/New-patches'
          api='https://api.github.com/repos/'+repo
          token=os.environ['GH_TOKEN']
          def req(url,data=None,method=None,ctype='application/json'):
              headers={'User-Agent':'LuckyPatch293','Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}
              if data is not None: headers['Content-Type']=ctype
              with urllib.request.urlopen(urllib.request.Request(url,data=data,method=method,headers=headers),timeout=120) as r:return r.read()
          body={'tag_name':'resources-293','target_commitish':os.environ['GITHUB_SHA'],'name':'행운서버 293 광대 외형 자동패치','body':'천사·악마 광대의 기본형 및 거리별 모델 수정용 런처 자동패치 파일입니다. 개별 DLL을 직접 덮어쓰지 말고 런처 자동패치를 이용해 주세요.','draft':False,'prerelease':False,'make_latest':'false'}
          try: release=json.loads(req(api+'/releases/tags/resources-293'))
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
              release=json.loads(req(api+'/releases',json.dumps(body).encode(),method='POST'))
          assets=[
           ('92ab71a6ac6202f898daf852690e2c3978cbdfa66bc52093911372f580f100fb.dll','https://raw.githubusercontent.com/'+repo+'/'+os.environ['GITHUB_SHA']+'/.release293/client.dll',2466816),
           ('58ef7b086155b080113300757dc035ef080dcd910dd1d29349abcdbcf6ca39b2.rfs','https://github.com/'+repo+'/releases/download/resources-291/58ef7b086155b080113300757dc035ef080dcd910dd1d29349abcdbcf6ca39b2.rfs',3410164)]
          for name,url,size in assets:
              with urllib.request.urlopen(url,timeout=120) as r:b=r.read()
              assert len(b)==size and hashlib.sha256(b).hexdigest()==name.rsplit('.',1)[0]
              existing=[a for a in release['assets'] if a['name']==name]
              if existing:
                  assert existing[0]['size']==size
                  continue
              endpoint=release['upload_url'].split('{')[0]+'?name='+name
              a=json.loads(req(endpoint,b,method='POST',ctype='application/octet-stream'))
              assert a['size']==size
              print('Verified asset uploaded:',name,size)
          PY
